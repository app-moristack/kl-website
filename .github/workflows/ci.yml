name: Verify application
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: kl_test
          MYSQL_ROOT_PASSWORD: ci-disposable-password
        ports: ['33306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-disposable-password"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_mysql, dom, curl, zip
          coverage: none
      - run: php scripts/check-runtime.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: php artisan test
      - name: Test MySQL integration
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: kl_test
          DB_HOST: 127.0.0.1
          DB_PORT: 33306
          DB_USERNAME: root
          DB_PASSWORD: ci-disposable-password
      - run: composer audit
      - run: npm audit --omit=dev
      - name: Validate container build
        run: docker build --target app -t kl-app:test .
      - name: Validate web image and Caddy configuration
        run: |
          docker build --target web -t kl-web:test .
          docker run --rm -e APP_DOMAIN=:80 kl-web:test caddy validate --config /etc/caddy/Caddyfile
      - name: Smoke test complete Docker Compose stack
        run: |
          bash scripts/setup.sh
          curl --fail --retry 12 --retry-delay 3 --retry-connrefused http://localhost:8080/up
          curl --fail --retry 12 --retry-delay 3 --retry-connrefused http://localhost:8080/en
          curl --fail http://localhost:8080/api/content/en
      - name: Remove disposable Docker test data
        if: always()
        run: if [ -f .env ]; then docker compose down --volumes; fi
