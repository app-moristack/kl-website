name: Deploy production
on:
  workflow_run:
    workflows: [Verify application]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-kl-website
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://kl-website.duckdns.org
    env:
      APP: kl-website
      DEPLOY_HOST: 62.83.10.197
      DEPLOY_USER: github-kl-website
      REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - name: Build production image
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          docker build --target production --label "org.opencontainers.image.revision=$REVISION" --tag "$APP:$REVISION" .
          docker run --rm "$APP:$REVISION" php artisan --version
          docker run --rm "$APP:$REVISION" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Configure restricted SSH access
        env:
          DEPLOY_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$HOST_KEY" > "$HOME/.ssh/known_hosts"
      - name: Deploy image, migrate and verify health
        run: |
          set -euo pipefail
          docker save "$APP:$REVISION" | gzip -1 | ssh \
            -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=120 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $REVISION"
      - name: Check public HTTPS endpoint
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://kl-website.duckdns.org/up > /dev/null
      - name: Remove temporary SSH key
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
