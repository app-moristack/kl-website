name: kl-website

x-php: &php
  image: kl-website:${IMAGE_TAG:-production}
  env_file: .env.production
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    SESSION_SECURE_COOKIE: "true"
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  volumes:
    - storage:/var/www/html/storage
  networks: [backend]
  depends_on:
    mysql:
      condition: service_healthy
  pids_limit: 128

services:
  app:
    <<: *php
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, 'php -r "exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  web:
    image: kl-website:${IMAGE_TAG:-production}
    command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    environment:
      APP_DOMAIN: ":8080"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - storage:/var/www/html/storage:ro
    networks:
      frontend:
        aliases: [kl-website-web]
      backend: {}
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  worker:
    <<: *php
    command: [php, artisan, 'queue:work', '--tries=3', '--backoff=30', '--timeout=60', '--max-time=3600']
    mem_limit: 192m
    cpus: 0.5
    stop_grace_period: 75s
  scheduler:
    <<: *php
    command: [php, artisan, 'schedule:work']
    mem_limit: 192m
    cpus: 0.25
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets: [mysql_root_password]
    command: ['--innodb-buffer-pool-size=64M', '--max-connections=50', '--performance-schema=OFF']
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [backend]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

networks:
  frontend:
    external: true
    name: kl-website_frontend
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.31.0/24

volumes:
  mysql-data:
  storage:

secrets:
  mysql_root_password:
    file: .secrets/mysql-root-password
